name: Rendre et publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # minuit, heure de Québec (05:00 UTC en hiver, 01:00 en été)
  workflow_dispatch:

# Le site est publié directement sur GitHub Pages : le CI n'écrit jamais dans main.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour dater les fichiers (scripts/maj_liens_partagedms.py)

      # Modifie seulement la copie de travail du CI : les liens sont à jour sur le site publié,
      # sans commit dans main.
      - name: Mettre à jour les liens de PartageDMS
        run: python3 scripts/maj_liens_partagedms.py

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Rendre le site (quarto render)
        run: quarto render

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site rendu
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
